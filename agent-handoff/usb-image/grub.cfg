set timeout=3
set default=0
insmod part_gpt
insmod fat
search --no-floppy --set=root --label NEXTDRIVE

menuentry "NextDrive station (READ-ONLY test build - no erasure)" {
    linux /live/vmlinuz boot=live live-media-path=/live components quiet loglevel=3 nopersistence noeject toram=no nofstab console=tty1 systemd.show_status=0 vt.global_cursor_default=0
    initrd /live/initrd.img
}

menuentry "NextDrive station - diagnostics (verbose boot, serial console)" {
    linux /live/vmlinuz boot=live live-media-path=/live components nopersistence noeject nofstab console=ttyS0,115200 console=tty1
    initrd /live/initrd.img
}
