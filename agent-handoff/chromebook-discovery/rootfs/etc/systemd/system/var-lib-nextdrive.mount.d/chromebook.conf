# Only the ND-STATE partition of THIS USB stick may be mounted read-write (fixed partition UUID set by
# assemble.sh), never a partition on the Chromebook's internal storage that happens to share the label.
[Unit]
After=nd-internal-ro.service
Requires=nd-internal-ro.service

[Mount]
What=/dev/disk/by-partuuid/4e574342-0000-4000-8000-0000000000e3
