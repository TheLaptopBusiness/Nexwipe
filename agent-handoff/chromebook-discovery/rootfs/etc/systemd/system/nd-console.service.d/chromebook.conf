# Chromebook discovery build: start the Chromebook wrapper around the unchanged read-only station,
# with process-level confinement. The program reports its own CapEff/NoNewPrivs/Seccomp at runtime
# (chromebook.confinement in the report), so the first boot on a unit shows whether this applied.
[Unit]
Requires=nd-internal-ro.service
After=nd-internal-ro.service

[Service]
ExecStart=
ExecStart=/usr/bin/python3 -m nd_chromebook
# The eMMC EXT_CSD register is only exposed through debugfs, which ProtectKernelTunables hides.
# Keep /sys, /proc/sys and the whole OS read-only for the program instead.
ProtectKernelTunables=no
ReadOnlyPaths=/sys /proc/sys
ProtectSystem=strict
ReadWritePaths=/var/lib/nextdrive
# No capabilities: cannot mount, swapon, set devices writable, send raw device commands (CAP_SYS_RAWIO),
# load modules or bypass file permissions.
CapabilityBoundingSet=
AmbientCapabilities=
# Device nodes: terminals read-write; disks READ-ONLY (opening a disk for writing fails with EPERM).
DevicePolicy=closed
DeviceAllow=char-tty rw
DeviceAllow=/dev/tty1 rw
DeviceAllow=block-sd r
DeviceAllow=block-mmc r
DeviceAllow=block-blkext r
# System calls: mount/umount/pivot_root, swapon/swapoff, raw I/O ports, module loading and reboot refused.
SystemCallFilter=~@mount @swap @raw-io @module @reboot @obsolete @cpu-emulation @clock
SystemCallErrorNumber=EPERM
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
